---
# Flink version and download settings
flink_version: "2.3.0"
flink_scala_version: "2.12"
flink_package: "flink-{{ flink_version }}-bin-scala_{{ flink_scala_version }}.tgz"
flink_download_url: "https://archive.apache.org/dist/flink/flink-{{ flink_version }}/{{ flink_package }}"

# Installation directories
flink_user: "flink"
flink_group: "flink"
flink_home: "/opt/flink"
flink_config_dir: "{{ flink_home }}/conf"
flink_log_dir: "/var/log/flink"
flink_data_dir: "/var/lib/flink"
flink_tmp_dir: "/tmp/flink"

# Java settings
java_home: "/usr/lib/jvm/java-21-openjdk-amd64"

# Flink configuration
flink_jobmanager_rpc_port: 6123
flink_jobmanager_heap_size: "1024m"
flink_taskmanager_heap_size: "1024m"
flink_taskmanager_memory_process_size: "1728m"
flink_taskmanager_memory_flink_size: "1280m"
flink_parallelism_default: 1
flink_taskmanager_numberOfTaskSlots: 1

# Cluster configuration
flink_cluster_mode: "standalone"  # standalone or kubernetes or yarn
flink_high_availability: false
flink_checkpointing_interval: "10000"

# Network configuration
flink_bind_host: "0.0.0.0"
flink_jobmanager_bind_host: "{{ flink_bind_host }}"
flink_taskmanager_bind_host: "{{ flink_bind_host }}"

# Service configuration
flink_start_service: true
flink_enable_service: true

# Security configuration
flink_web_ssl_enabled: false
flink_web_ssl_keystore_path: ""
flink_web_ssl_keystore_password: ""
flink_web_ssl_truststore_path: ""
flink_web_ssl_truststore_password: ""

# JVM security options
flink_jvm_security_enabled: true

# JVM monitoring and performance
flink_jvm_gc_logging: true
flink_jvm_heap_dump_on_oom: true
flink_jvm_heap_dump_path: "{{ flink_log_dir }}"

# Metrics configuration
flink_metrics_jmx_enabled: true
flink_metrics_jmx_port: "8789"
flink_metrics_jmx_bind_address: "0.0.0.0"

# Log configuration
flink_log_level: "INFO"
flink_log_max_files: 10

flink_log_max_size: "100MB"

# SQL Gateway configuration
flink_sql_gateway_enabled: true
flink_sql_gateway_start_service: true
flink_sql_gateway_rest_address: "0.0.0.0"
flink_sql_gateway_rest_port: 8083
flink_sql_gateway_endpoint_type: "rest"
flink_sql_gateway_session_check_interval: "1 min"
flink_sql_gateway_session_idle_timeout: "10 min"
flink_sql_gateway_session_max_num: 1000000
flink_sql_gateway_session_plan_cache_enabled: false
flink_sql_gateway_session_plan_cache_size: 100
flink_sql_gateway_session_plan_cache_ttl: "1 hour"
flink_sql_gateway_worker_keepalive_time: "5 min"
flink_sql_gateway_worker_threads_max: 500
flink_sql_gateway_worker_threads_min: 5
