---
- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  retries: 5
  delay: 15
  register: update_result
  until: update_result is succeeded

- name: Check if Java is already installed
  command: which java
  register: java_check
  failed_when: false
  changed_when: false

- name: Check Java version
  shell: |
    java -version 2>&1 | grep -oP 'version "\K[0-9]+' || echo "0"
  register: java_version_major
  when: java_check.rc == 0
  changed_when: false

- name: Set Java facts
  set_fact:
    java_installed: "{{ java_check.rc == 0 and (java_version_major.stdout | int) >= 21 }}"
    java_version_ok: "{{ java_check.rc == 0 and (java_version_major.stdout | int) >= 21 }}"

- name: Detect existing Java 21+ installation path
  shell: |
    java_bin=$(which java)
    while [ -L "$java_bin" ]; do
      java_bin=$(readlink -f "$java_bin")
    done
    java_home=$(dirname $(dirname "$java_bin"))
    echo "$java_home"
  register: detected_java_home
  when: java_version_ok
  changed_when: false

- name: Check for common Java 21 installation paths if no compatible Java found
  stat:
    path: "{{ item }}"
  register: java_path_check
  loop:
    - "/usr/lib/jvm/java-21-openjdk-amd64"
    - "/usr/lib/jvm/java-17-openjdk-amd64"
    - "/usr/lib/jvm/default-java"
    - "/opt/java"
    - "/usr/java/latest"
  when: not java_version_ok

- name: Set detected Java path from common locations
  set_fact:
    detected_java_path_from_common: "{{ item.item }}"
  when: not java_version_ok and item.stat.exists and item.stat.isdir
  loop: "{{ java_path_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install Java 21 if not already present
  apt:
    name: openjdk-21-jdk
    state: present
  when: not java_version_ok
  retries: 5
  delay: 15
  register: java_result
  until: java_result is succeeded

- name: Set default java_home after installation if needed
  set_fact:
    post_install_java_home: "/usr/lib/jvm/java-21-openjdk-amd64"
  when: not java_version_ok

- name: Update java_home variable with detected or default path
  set_fact:
    java_home: "{{ detected_java_home.stdout if detected_java_home.stdout is defined and detected_java_home.stdout != '' else (detected_java_path_from_common | default(post_install_java_home | default(java_home))) }}"

- name: Display Java configuration being used
  debug:
    msg: "Using Java installation at: {{ java_home }}"

- name: Create flink group
  group:
    name: "{{ flink_group }}"
    state: present

- name: Create flink user
  user:
    name: "{{ flink_user }}"
    group: "{{ flink_group }}"
    system: yes
    shell: /bin/bash
    home: "{{ flink_home }}"
    create_home: no
    state: present

- name: Create flink directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    mode: '0755'
  loop:
    - "{{ flink_home }}"
    - "{{ flink_log_dir }}"
    - "{{ flink_data_dir }}"
    - "{{ flink_tmp_dir }}"

- name: Check if Flink is already installed
  stat:
    path: "{{ flink_home }}/bin/flink"
  register: flink_installed

- name: Download Flink
  shell: |
    wget --show-progress --progress=bar:force:noscroll -O "/tmp/{{ flink_package }}" "{{ flink_download_url }}"
  args:
    creates: "/tmp/{{ flink_package }}"
  when: not flink_installed.stat.exists
  async: 1200
  poll: 10
  register: download_result

- name: Check if downloaded Flink package exists
  stat:
    path: "/tmp/{{ flink_package }}"
  register: flink_package_stat
  when: not flink_installed.stat.exists

- name: Extract Flink
  unarchive:
    src: "/tmp/{{ flink_package }}"
    dest: "/opt"
    remote_src: yes
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    creates: "{{ flink_home }}/bin/flink"
  when: not flink_installed.stat.exists and (flink_package_stat.stat.exists | default(false))

- name: Create symlink for Flink installation
  file:
    src: "/opt/flink-{{ flink_version }}"
    dest: "{{ flink_home }}"
    state: link
    force: true
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
  when: not flink_installed.stat.exists and (flink_package_stat.stat.exists | default(false))

- name: Set ownership of Flink directory
  file:
    path: "{{ flink_home }}"
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    recurse: yes
    state: directory
  when: flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false))

- name: Generate Flink configuration
  template:
    src: flink-conf.yaml.j2
    dest: "{{ flink_config_dir }}/flink-conf.yaml"
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    mode: '0644'
    backup: yes
  notify:
    - restart flink-jobmanager
    - restart flink-taskmanager
  when: flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false))


- name: Create Flink JobManager systemd service file
  template:
    src: flink-jobmanager.service.j2
    dest: /etc/systemd/system/flink-jobmanager.service
    mode: '0644'
  notify:
    - reload systemd
    - restart flink-jobmanager
  when: flink_role is defined and flink_role == 'master'

- name: Create Flink TaskManager systemd service file
  template:
    src: flink-taskmanager.service.j2
    dest: /etc/systemd/system/flink-taskmanager.service
    mode: '0644'
  notify:
    - reload systemd
    - restart flink-taskmanager
  when: flink_role is defined and flink_role == 'worker'

- name: Set JAVA_HOME environment
  lineinfile:
    path: "{{ flink_home }}/conf/flink-conf.yaml"
    line: "env.java.home: {{ java_home }}"
    create: yes
  notify:
    - restart flink-jobmanager
    - restart flink-taskmanager
  when: flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false))

- name: Configure log rotation for Flink logs
  copy:
    content: |
      {{ flink_log_dir }}/*.log {
          daily
          missingok
          rotate {{ flink_log_max_files }}
          compress
          notifempty
          create 644 {{ flink_user }} {{ flink_group }}
          size {{ flink_log_max_size }}
          copytruncate
      }
    dest: /etc/logrotate.d/flink
    mode: '0644'
  when: flink_log_max_files is defined and flink_log_max_size is defined

- name: Clean up downloaded package
  file:
    path: "/tmp/{{ flink_package }}"
    state: absent

- name: Start and enable Flink JobManager service
  systemd:
    name: flink-jobmanager
    state: "{{ 'started' if flink_start_service else 'stopped' }}"
    enabled: "{{ flink_enable_service }}"
    daemon_reload: yes
  when: flink_role is defined and flink_role == 'master' and (flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false)))

- name: Start and enable Flink TaskManager service
  systemd:
    name: flink-taskmanager
    state: "{{ 'started' if flink_start_service else 'stopped' }}"
    enabled: "{{ flink_enable_service }}"
    daemon_reload: yes
  when: flink_role is defined and flink_role == 'worker' and (flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false)))

- name: Create Flink SQL Gateway systemd service file
  template:
    src: flink-sql-gateway.service.j2
    dest: /etc/systemd/system/flink-sql-gateway.service
    mode: '0644'
  notify:
    - reload systemd
    - restart flink-sql-gateway
  when: flink_sql_gateway_enabled | default(true)

- name: Start and enable Flink SQL Gateway service
  systemd:
    name: flink-sql-gateway
    state: "{{ 'started' if flink_sql_gateway_start_service else 'stopped' }}"
    enabled: "{{ flink_sql_gateway_start_service }}"
    daemon_reload: yes
  when:
    - flink_sql_gateway_enabled | default(true)
    - flink_role is defined and flink_role == 'master'
    - flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false))

- name: Wait for Flink SQL Gateway REST endpoint to be available
  wait_for:
    port: "{{ flink_sql_gateway_rest_port }}"
    host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
    delay: 5
    timeout: 60
  when:
    - flink_sql_gateway_enabled | default(true)
    - flink_role is defined and flink_role == 'master'
    - flink_sql_gateway_start_service | default(true)
    - flink_sql_gateway_endpoint_type == 'rest'
    - flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false))

- name: Wait for Flink service to be active (JobManager)
  wait_for:
    port: "{{ flink_jobmanager_rpc_port }}"
    host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
    delay: 15
    timeout: 120
  when: flink_role is defined and flink_role == 'master' and flink_start_service and (flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false)))

- name: Wait for Flink Web UI to be available
  wait_for:
    port: '8081'
    host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
    delay: 5
    timeout: 60
  when: flink_role is defined and flink_role == 'master' and flink_start_service and (flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false)))

- name: Verify Flink installation
  command: "{{ flink_home }}/bin/flink --version"
  register: flink_version_check
  changed_when: false
  failed_when: flink_version_check.rc != 0
  when: flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false))

- name: Display Flink version information
  debug:
    msg: "Flink installation verified: {{ flink_version_check.stdout_lines[0] if flink_version_check.stdout_lines else 'Version check failed' }}"
  when: flink_installed.stat.exists or (flink_package_stat.stat.exists | default(false))
