---
- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Check if Java is already installed
  command: which java
  register: java_check
  failed_when: false
  changed_when: false

- name: Detect existing Java installation path
  shell: |
    if [ -n "$(which java)" ]; then
      java_bin=$(which java)
      # Follow symlinks to get the real java binary
      while [ -L "$java_bin" ]; do
        java_bin=$(readlink -f "$java_bin")
      done
      # Get JAVA_HOME by going up from bin/java
      java_home=$(dirname $(dirname "$java_bin"))
      echo "$java_home"
    fi
  register: detected_java_home
  when: java_check.rc == 0
  changed_when: false

- name: Check for common Java installation paths if java command not found
  stat:
    path: "{{ item }}"
  register: java_path_check
  loop:
    - "/usr/lib/jvm/java-11-openjdk-amd64"
    - "/usr/lib/jvm/java-8-openjdk-amd64"
    - "/usr/lib/jvm/default-java"
    - "/opt/java"
    - "/usr/java/latest"
  when: java_check.rc != 0

- name: Set detected Java path from common locations
  set_fact:
    detected_java_path_from_common: "{{ item.item }}"
  when: java_check.rc != 0 and item.stat.exists and item.stat.isdir
  loop: "{{ java_path_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set Java facts
  set_fact:
    java_installed: "{{ java_check.rc == 0 or detected_java_path_from_common is defined }}"
    detected_java_path: "{{ detected_java_home.stdout | default(detected_java_path_from_common | default('')) }}"

- name: Install required packages (without Java if already installed)
  package:
    name:
      - curl
      - wget
      - tar
      - python3
    state: present

- name: Install Java if not already present
  package:
    name: openjdk-11-jdk
    state: present
  when: not java_installed

- name: Set default java_home after installation if needed
  set_fact:
    post_install_java_home: "/usr/lib/jvm/java-11-openjdk-amd64"
  when: not java_installed

- name: Update java_home variable with detected or default path
  set_fact:
    java_home: "{{ detected_java_path if detected_java_path != '' else (post_install_java_home | default(java_home)) }}"

- name: Display Java configuration being used
  debug:
    msg: "Using Java installation at: {{ java_home }}"

- name: Create flink group
  group:
    name: "{{ flink_group }}"
    state: present

- name: Create flink user
  user:
    name: "{{ flink_user }}"
    group: "{{ flink_group }}"
    system: yes
    shell: /bin/bash
    home: "{{ flink_home }}"
    create_home: no
    state: present

- name: Create flink directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    mode: '0755'
  loop:
    - "{{ flink_home }}"
    - "{{ flink_log_dir }}"
    - "{{ flink_data_dir }}"
    - "{{ flink_tmp_dir }}"

- name: Check if Flink is already installed
  stat:
    path: "{{ flink_home }}/bin/flink"
  register: flink_installed

- name: Download Flink
  get_url:
    url: "{{ flink_download_url }}"
    dest: "/tmp/{{ flink_package }}"
    mode: '0644'
  when: not flink_installed.stat.exists

- name: Extract Flink
  unarchive:
    src: "/tmp/{{ flink_package }}"
    dest: "/opt"
    remote_src: yes
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    creates: "{{ flink_home }}/bin/flink"
  when: not flink_installed.stat.exists

- name: Create symlink for Flink installation
  file:
    src: "/opt/flink-{{ flink_version }}"
    dest: "{{ flink_home }}"
    state: link
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
  when: not flink_installed.stat.exists

- name: Set ownership of Flink directory
  file:
    path: "{{ flink_home }}"
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    recurse: yes
    state: directory

- name: Generate Flink configuration
  template:
    src: flink-conf.yaml.j2
    dest: "{{ flink_config_dir }}/flink-conf.yaml"
    owner: "{{ flink_user }}"
    group: "{{ flink_group }}"
    mode: '0644'
    backup: yes
  notify:
    - restart flink

- name: Create Flink systemd service file
  template:
    src: flink.service.j2
    dest: /etc/systemd/system/flink.service
    mode: '0644'
  notify:
    - reload systemd
    - restart flink

- name: Set JAVA_HOME environment
  lineinfile:
    path: "{{ flink_home }}/conf/flink-conf.yaml"
    line: "env.java.home: {{ java_home }}"
    create: yes
  notify:
    - restart flink

- name: Clean up downloaded package
  file:
    path: "/tmp/{{ flink_package }}"
    state: absent

- name: Start and enable Flink service
  systemd:
    name: flink
    state: "{{ 'started' if flink_start_service else 'stopped' }}"
    enabled: "{{ flink_enable_service }}"
    daemon_reload: yes
  when: flink_role is defined and flink_role == 'master'

- name: Start and enable Flink TaskManager service
  systemd:
    name: flink
    state: "{{ 'started' if flink_start_service else 'stopped' }}"
    enabled: "{{ flink_enable_service }}"
    daemon_reload: yes
  when: flink_role is defined and flink_role == 'worker'