all:
  children:
    flink_servers:
      hosts:
        flink-master:
          ansible_host: 172.16.100.140
          flink_role: master
        flink-worker-1:
          ansible_host: 172.16.100.140
          flink_role: worker
      vars:
        ansible_user: user
        # Security Note: Use ansible-vault for passwords or SSH keys for authentication
        # ansible_password: "{{ vault_ansible_password }}"
        ansible_become: true
        ansible_become_method: sudo
        # ansible_become_password: "{{ vault_ansible_become_password }}"
