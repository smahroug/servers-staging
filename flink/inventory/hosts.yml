---
all:
  children:
    flink_servers:
      hosts:
        # Example hosts - replace with your actual servers
        flink-master:
          ansible_host: flink-server
          flink_role: master
        flink-worker-1:
          ansible_host: flink-server
          flink_role: worker
      vars:
        # Common variables for all Flink servers
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_rsa