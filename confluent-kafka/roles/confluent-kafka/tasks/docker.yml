---
# ==============================================================================
# Docker installation (skipped when Docker is already present)
# Uses the official Docker apt repository on Ubuntu/Debian; falls back to
# distro packages elsewhere.
# ==============================================================================

- name: Check if Docker is already installed
  command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Set Docker facts
  set_fact:
    docker_installed: "{{ docker_check.rc == 0 }}"

- name: Display Docker status
  debug:
    msg: >-
      {{ 'Docker detected: ' ~ docker_check.stdout | trim if docker_installed
         else 'Docker not found - installing' }}

# --- Official Docker apt repository (Debian/Ubuntu) --------------------------
- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  when: not docker_installed and ansible_os_family == "Debian"
  retries: 5
  delay: 10
  register: docker_prereqs
  until: docker_prereqs is succeeded

- name: Create Docker keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not docker_installed and ansible_os_family == "Debian"

- name: Download Docker GPG key
  get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not docker_installed and ansible_os_family == "Debian"
  retries: 3
  delay: 5
  register: docker_gpg
  until: docker_gpg is succeeded

- name: Add Docker apt repository
  copy:
    content: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    dest: /etc/apt/sources.list.d/docker.list
    mode: '0644'
  when: not docker_installed and ansible_os_family == "Debian"
  register: docker_repo

- name: Install Docker Engine, CLI and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  when: not docker_installed and ansible_os_family == "Debian"
  retries: 5
  delay: 15
  register: docker_install
  until: docker_install is succeeded

# --- Fallback: distro packages (non-Debian families) --------------------------
- name: Install Docker from distro packages
  package:
    name:
      - docker
      - docker-compose
    state: present
  when: not docker_installed and ansible_os_family != "Debian"
  retries: 5
  delay: 15
  register: docker_install_generic
  until: docker_install_generic is succeeded

- name: Ensure Docker is started and enabled
  systemd:
    name: docker
    state: started
    enabled: yes
  when: not docker_installed or (docker_install is changed) or (docker_install_generic is changed)

- name: Wait for Docker daemon to be ready
  command: docker info
  register: docker_info
  until: docker_info.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Add ansible_user to the docker group
  user:
    name: "{{ ansible_user | default(ansible_env.USER, true) | default('user', true) }}"
    groups: docker
    append: yes
  when: ansible_user is defined
  failed_when: false

- name: Display Docker version
  command: docker --version
  register: docker_version_out
  changed_when: false

- name: Show installed Docker version
  debug:
    msg: "{{ docker_version_out.stdout | trim }}"
