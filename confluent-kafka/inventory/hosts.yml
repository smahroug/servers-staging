all:
  children:
    confluent_kafka_servers:
      hosts:
        confluent-kafka:
          ansible_host: 192.168.56.5
      vars:
        ansible_user: user
        ansible_password: "user"
        # Security Note: Use ansible-vault for passwords or SSH keys for authentication
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_pass: "user"
        ansible_python_interpreter: /usr/bin/python3
