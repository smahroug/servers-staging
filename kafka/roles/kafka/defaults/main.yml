---
# Kafka version and download settings
kafka_version: "3.7.0"
kafka_scala_version: "2.13"
kafka_package: "kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
kafka_download_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"

# Installation directories
kafka_user: "kafka"
kafka_group: "kafka"
kafka_home: "/opt/kafka"
kafka_config_dir: "{{ kafka_home }}/config"
kafka_log_dir: "/var/log/kafka"
kafka_data_dir: "/var/lib/kafka"
kafka_tmp_dir: "/tmp/kafka"

# Java settings
java_home: "/usr/lib/jvm/java-21-openjdk-amd64"

# KRaft configuration (single combined broker + controller node, no ZooKeeper)
kafka_node_id: 0
# Leave empty to auto-generate a random cluster ID on first installation
kafka_cluster_id: ""
kafka_controller_port: 9093
kafka_controller_quorum_voters: "{{ kafka_node_id }}@localhost:{{ kafka_controller_port }}"

# Network configuration
kafka_bind_host: "0.0.0.0"
kafka_port: 9092
# Hostname/IP advertised to clients. Prefers the inventory `ansible_host`
# (the address used to reach the broker), falls back to the detected default
# IPv4 address. Override with kafka_advertised_host_override if needed.
kafka_advertised_host_override: ""
kafka_advertised_host: >-
  {{ kafka_advertised_host_override if (kafka_advertised_host_override | length > 0) else (hostvars[inventory_hostname]['ansible_host'] | default(ansible_default_ipv4.address | default(inventory_hostname))) }}

# Broker settings
kafka_num_network_threads: 3
kafka_num_io_threads: 8
kafka_socket_send_buffer_bytes: 102400
kafka_socket_receive_buffer_bytes: 102400
kafka_socket_request_max_bytes: 104857600
kafka_num_partitions: 1
kafka_default_replication_factor: 1
kafka_offsets_topic_replication_factor: 1
kafka_transaction_state_log_replication_factor: 1
kafka_transaction_state_log_min_isr: 1
kafka_num_recovery_threads_per_data_dir: 1
kafka_log_retention_hours: 168
kafka_log_retention_bytes: 1073741824
kafka_log_segment_bytes: 1073741824
kafka_log_retention_check_interval_ms: 300000
kafka_group_initial_rebalance_delay_ms: 0
kafka_auto_create_topics_enable: true

# Heap settings
kafka_heap_opts: "-Xms512m -Xmx1G"

# Service configuration
kafka_start_service: true
kafka_enable_service: true

# Log configuration
kafka_log_level: "INFO"
kafka_log_max_files: 10
kafka_log_max_size: "100MB"

# Metrics (JMX)
kafka_jmx_enabled: true
kafka_jmx_port: 9999
