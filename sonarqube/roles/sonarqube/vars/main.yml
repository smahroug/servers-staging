---
# Environment-specific variables can be overridden here
# These variables have higher precedence than defaults

# Example: Production environment might use different memory settings
# sonarqube_web_java_opts: "-Xms1024m -Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
# sonarqube_ce_java_opts: "-Xms1024m -Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
# sonarqube_es_java_opts: "-Xms1024m -Xmx1024m -XX:+HeapDumpOnOutOfMemoryError"

# Example: Different SonarQube version for testing
# sonarqube_version: "10.5.1.90531"

# Example: PostgreSQL database configuration for production
# sonarqube_db_type: "postgresql"
# sonarqube_db_host: "db.example.com"
# sonarqube_db_name: "sonarqube_prod"
# sonarqube_db_user: "sonarqube_prod"
# sonarqube_db_password: "secure_password_here"
