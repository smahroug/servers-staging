---
# Docker version and repository settings
docker_repo_url: "https://download.docker.com/linux/ubuntu"
docker_gpg_key_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_apt_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Users to add to the docker group
docker_users:
  - user

# Logging configuration
docker_log_driver: "json-file"
docker_log_max_size: "10m"
docker_log_max_file: "3"

# Extra raw JSON appended to daemon.json (must include leading comma, e.g. ", \"registry-mirrors\": [...]")
docker_extra_config: ""

# Remote API exposure. Empty list = unix socket only (systemd default).
# WARNING: TCP 2375 is unauthenticated/unencrypted — restrict with docker_api_firewall_sources.
docker_api_hosts: []
#  - "unix:///var/run/docker.sock"
#  - "tcp://0.0.0.0:2375"

# Firewall (ufw) rules for the Docker API. Empty = no rule added.
docker_api_firewall_sources: []
#  - "192.168.56.0/24"

# Ports to allow in ufw (e.g. published container ports like PostgreSQL 5432)
docker_firewall_allow_ports: []
#  - 5432/tcp
