---
# Docker installation tasks

- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  retries: 5
  delay: 15
  register: update_result
  until: update_result is succeeded

- name: Install required system packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3
      - acl
    state: present

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Check if Docker GPG key is already installed
  stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_gpg_key

- name: Download Docker official GPG key
  get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not docker_gpg_key.stat.exists

- name: Add Docker APT repository
  apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_repo_url }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: yes
  retries: 5
  delay: 15
  register: repo_result
  until: repo_result is succeeded

- name: Install Docker Engine and related packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  retries: 5
  delay: 15
  register: docker_install
  until: docker_install is succeeded
  notify: restart docker

- name: Configure Docker daemon
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Create Docker systemd drop-in directory
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: Configure Docker API listeners (systemd drop-in)
  template:
    src: docker-api.conf.j2
    dest: /etc/systemd/system/docker.service.d/docker-api.conf
    mode: '0644'
  notify: restart docker
  when: docker_api_hosts | length > 0

- name: Remove Docker API systemd drop-in when disabled
  file:
    path: /etc/systemd/system/docker.service.d/docker-api.conf
    state: absent
  notify: restart docker
  when: docker_api_hosts | length == 0

- name: Install ufw
  apt:
    name: ufw
    state: present
  when: docker_api_firewall_sources | length > 0 or docker_firewall_allow_ports | length > 0

- name: Allow Docker API in ufw
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "2375"
    proto: tcp
    comment: Docker remote API
  loop: "{{ docker_api_firewall_sources }}"
  when: docker_api_hosts | select('search', 'tcp://') | list | length > 0

- name: Allow published container ports in ufw
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] if '/' in item else 'tcp' }}"
  loop: "{{ docker_firewall_allow_ports }}"

- name: Ensure docker group exists
  group:
    name: docker
    state: present

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  notify: restart docker

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
    daemon_reload: yes

- name: Check Docker version
  command: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version
  debug:
    msg: "Docker installed: {{ docker_version.stdout }}"

- name: Verify Docker API is listening
  command: ss -tln
  register: docker_listeners
  changed_when: false

- name: Display Docker API listeners
  debug:
    msg: "{{ docker_listeners.stdout_lines | select('search', ':2375') | list | default(['TCP API not enabled']) }}"
